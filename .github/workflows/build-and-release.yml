name: Build & Release Presenter

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish release on GitHub'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  # =========================================================================
  # Windows: Bun Executables, PE Metadata Stamping & Inno Setup Installer
  # =========================================================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate High-Resolution Icons & ICO
        run: bun run generate:icons

      - name: Build Windows Executables & Assets
        run: |
          bun run build:server:windows
          bun run build:gui:windows
          bun run build:assets

      - name: Embed Windows PE Version Metadata & Icon
        run: bun run stamp:metadata

      - name: Digital Code Signing (Executables)
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:CERT_BASE64) {
            Write-Host "Decoding certificate for digital signature..."
            [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT_BASE64))
            signtool sign /f cert.pfx /p "$env:CERT_PASS" /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist/presenter-server-windows-x64.exe dist/presenter-gui-windows-x64.exe
            Remove-Item cert.pfx -Force
            Write-Host "Successfully signed Windows executables."
          } else {
            Write-Host "WINDOWS_CERTIFICATE_BASE64 secret not set; skipping executable digital signing."
          }

      - name: Compile Inno Setup Windows Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\presenter.iss

      - name: Digital Code Signing (Installer)
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:CERT_BASE64) {
            [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT_BASE64))
            signtool sign /f cert.pfx /p "$env:CERT_PASS" /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist/installer/Presenter-Setup-x64.exe
            Remove-Item cert.pfx -Force
            Write-Host "Successfully signed Presenter-Setup-x64.exe."
          }

      - name: Create Windows Portable Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/presenter-gui-windows-x64.exe, dist/presenter-server-windows-x64.exe, dist/public, dist/db, assets/icon.ico, README.md, LICENSE -DestinationPath dist/Presenter-Windows-x64-Portable.zip

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Presenter-Windows-x64
          path: |
            dist/installer/Presenter-Setup-x64.exe
            dist/Presenter-Windows-x64-Portable.zip

  # =========================================================================
  # Linux: Server Binary, Tarball & Debian Package (.deb)
  # =========================================================================
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate High-Resolution Icons
        run: bun run generate:icons

      - name: Build Linux Server Binary & Assets
        run: |
          bun run build:server:linux
          bun run build:assets

      - name: Package Linux Tarball & Debian (.deb)
        run: bun run scripts/package-linux.ts

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Presenter-Linux-x64
          path: |
            dist/Presenter-Linux-x64.tar.gz
            dist/Presenter-Linux-x64.deb

  # =========================================================================
  # macOS: Server Binaries (Apple Silicon ARM64 & Intel x64)
  # =========================================================================
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate High-Resolution Icons
        run: bun run generate:icons

      - name: Build macOS Binaries (ARM64 & x64) & Assets
        run: |
          bun run build:server:macos-arm64
          bun run build:server:macos
          bun run build:assets

      - name: Package macOS Archives
        run: |
          mkdir -p dist/mac-arm64 dist/mac-x64
          cp dist/presenter-server-macos-arm64 dist/mac-arm64/presenter
          cp -r dist/public dist/db assets/icon.png README.md LICENSE dist/mac-arm64/
          cd dist/mac-arm64 && zip -r ../Presenter-macOS-arm64.zip . && cd ../..

          cp dist/presenter-server-macos-x64 dist/mac-x64/presenter
          cp -r dist/public dist/db assets/icon.png README.md LICENSE dist/mac-x64/
          cd dist/mac-x64 && zip -r ../Presenter-macOS-x64.zip . && cd ../..

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Presenter-macOS
          path: |
            dist/Presenter-macOS-arm64.zip
            dist/Presenter-macOS-x64.zip

  # =========================================================================
  # Release: Automatically create Git tag and publish GitHub Release
  # =========================================================================
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.release != false)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Determine & Create Git Tag
        id: versioning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="Presenter ${TAG_NAME}"
          else
            PKG_VERSION=$(bun -e "console.log(require('./package.json').version)")
            TARGET_TAG="v${PKG_VERSION}"

            # Check if tag already exists in remote
            if git ls-remote --tags origin "refs/tags/${TARGET_TAG}" | grep -q "${TARGET_TAG}"; then
              TAG_NAME="v${PKG_VERSION}-build.${{ github.run_number }}"
              RELEASE_NAME="Presenter v${PKG_VERSION} (Build ${{ github.run_number }})"
            else
              TAG_NAME="${TARGET_TAG}"
              RELEASE_NAME="Presenter ${TARGET_TAG}"
            fi

            echo "Creating and pushing Git tag: ${TAG_NAME}..."
            git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
            git push origin "${TAG_NAME}"
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-packages
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd release-packages
          find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} + | sed 's| \./| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.versioning.outputs.release_name }}
          files: release-packages/*
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
