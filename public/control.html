<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Scripture Control</title>
		<style>
			:root {
				--bg: #ffffff;
				--surface: #ffffff;
				--surface-alt: #f4f4f4;
				--text: #0a0a0a;
				--text-muted: #6b6b6b;
				--text-faint: #a3a3a3;
				--border: #0a0a0a;
				--border-soft: #d9d9d9;
				--accent: #ec1e79;
				--accent-contrast: #ffffff;
				--live: #0a0a0a;
				--live-soft: #f4f4f4;
				--danger: #ec1e3a;
				--bar-fill: #0a0a0a;
				--bar-track: #ececec;
			}

			html[data-theme="dark"] {
				--bg: #000000;
				--surface: #0a0a0a;
				--surface-alt: #131313;
				--text: #f5f5f5;
				--text-muted: #9a9a9a;
				--text-faint: #5c5c5c;
				--border: #f5f5f5;
				--border-soft: #2a2a2a;
				--accent: #ff2f8e;
				--accent-contrast: #000000;
				--live: #f5f5f5;
				--live-soft: #131313;
				--danger: #ff5566;
				--bar-fill: #f5f5f5;
				--bar-track: #1e1e1e;
			}

			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html {
				color-scheme: light dark;
			}

			body {
				font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
				-webkit-font-smoothing: antialiased;
				transition:
					background 0.2s ease,
					color 0.2s ease;
			}

			.mono {
				font-family:
					"SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", Menlo,
					monospace;
			}

			.shell {
				max-width: 780px;
				margin: 0 auto;
				padding: 40px 28px;
			}

			/* ── Tag row (now holds the theme toggle too) ───────── */
			.tag-row {
				display: flex;
				align-items: center;
				justify-content: space-between;
				margin-bottom: 24px;
				padding-bottom: 18px;
				border-bottom: 1px solid var(--border);
			}

			.tag-left {
				display: flex;
				align-items: center;
				gap: 10px;
			}

			.tag-new {
				background: var(--accent);
				color: var(--accent-contrast);
				font-size: 11px;
				font-weight: 800;
				letter-spacing: 0.04em;
				padding: 3px 8px;
			}
			.tag-label {
				font-size: 12px;
				font-weight: 700;
				letter-spacing: 0.06em;
				color: var(--text-muted);
			}

			.theme-toggle {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 32px;
				height: 32px;
				border: 1px solid var(--border);
				background: var(--bg);
				color: var(--text);
				cursor: pointer;
				transition:
					background 0.12s ease,
					color 0.12s ease;
			}
			.theme-toggle:hover {
				background: var(--text);
				color: var(--bg);
			}
			.theme-toggle svg {
				width: 15px;
				height: 15px;
			}
			.theme-toggle .icon-sun,
			.theme-toggle .icon-moon,
			.theme-toggle .icon-auto {
				display: none;
			}
			.theme-toggle[data-mode="auto"] .icon-auto {
				display: block;
			}
			.theme-toggle[data-mode="light"] .icon-sun {
				display: block;
			}
			.theme-toggle[data-mode="dark"] .icon-moon {
				display: block;
			}

			/* ── Search ─────────────────────────────────────────── */
			#search {
				width: 100%;
				font-size: 20px;
				font-weight: 500;
				padding: 16px 18px;
				border: 1px solid var(--border);
				background: var(--surface);
				color: var(--text);
				transition:
					background 0.2s ease,
					color 0.2s ease,
					box-shadow 0.12s ease;
			}
			#search::placeholder {
				color: var(--text-faint);
			}
			#search:focus {
				outline: none;
				box-shadow: inset 0 0 0 2px var(--accent);
			}

			/* ── Status bar ─────────────────────────────────────── */
			#status-bar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				margin-top: -1px;
				padding: 13px 18px;
				background: var(--surface-alt);
				border: 1px solid var(--border);
				border-top: none;
			}

			.status-left {
				display: flex;
				align-items: center;
				gap: 10px;
				min-width: 0;
				font-size: 13px;
				color: var(--text-muted);
			}

			.live-dot {
				flex-shrink: 0;
				width: 7px;
				height: 7px;
				background: var(--text-faint);
			}
			.live-dot.on {
				background: var(--accent);
			}

			#current-book-name {
				color: var(--text);
				font-weight: 700;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			button {
				font-family: inherit;
				border: 1px solid var(--border);
				cursor: pointer;
				font-weight: 700;
				transition:
					background 0.12s ease,
					color 0.12s ease;
			}

			/* ── Results ────────────────────────────────────────── */
			#results {
				margin-top: 18px;
				max-height: 56vh;
				overflow-y: auto;
				border: 1px solid var(--border);
				background: var(--surface);
				transition:
					background 0.2s ease,
					border-color 0.2s ease;
			}

			#results::-webkit-scrollbar {
				width: 9px;
			}
			#results::-webkit-scrollbar-track {
				background: transparent;
			}
			#results::-webkit-scrollbar-thumb {
				background: var(--border-soft);
				border: 2px solid var(--surface);
			}
			#results {
				scrollbar-width: thin;
				scrollbar-color: var(--border-soft) transparent;
			}

			.empty-state {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 10px;
				padding: 60px 24px;
				color: var(--text-faint);
				text-align: center;
			}
			.empty-state svg {
				width: 26px;
				height: 26px;
				opacity: 0.4;
			}
			.empty-state span {
				font-size: 13px;
			}

			.result {
				display: flex;
				align-items: baseline;
				gap: 12px;
				padding: 14px 18px;
				border-bottom: 1px solid var(--border-soft);
				cursor: pointer;
				line-height: 1.55;
				font-size: 15px;
				position: relative;
				transition: background 0.1s ease;
			}
			.result:last-child {
				border-bottom: none;
			}
			.result:hover {
				background: var(--surface-alt);
			}

			.result.active {
				background: var(--live-soft);
			}
			.result.active::before {
				content: "";
				position: absolute;
				left: 0;
				top: 0;
				bottom: 0;
				width: 3px;
				background: var(--accent);
			}

			.result.focused {
				outline: 2px solid var(--accent);
				outline-offset: -2px;
			}

			.result .ref {
				flex-shrink: 0;
				font-weight: 700;
				font-size: 13px;
				letter-spacing: -0.01em;
			}

			/* ── Context menu ───────────────────────────────────── */
			#contextMenu {
				position: fixed;
				display: none;
				background: var(--surface);
				border: 1px solid var(--border);
				box-shadow: 4px 4px 0 var(--border);
				padding: 4px;
				z-index: 1000;
				min-width: 170px;
			}
			#contextMenu .menu-item {
				display: flex;
				align-items: center;
				gap: 9px;
				padding: 9px 12px;
				cursor: pointer;
				font-size: 13px;
				font-weight: 600;
				color: var(--text);
			}
			#contextMenu .menu-item:hover {
				background: var(--text);
				color: var(--bg);
			}
			#contextMenu svg {
				width: 15px;
				height: 15px;
				flex-shrink: 0;
			}

			/* ── Toast ──────────────────────────────────────────── */
			#toast {
				position: fixed;
				bottom: 28px;
				left: 50%;
				transform: translateX(-50%) translateY(20px);
				background: var(--text);
				color: var(--bg);
				padding: 10px 18px;
				font-size: 12px;
				font-weight: 700;
				letter-spacing: 0.02em;
				opacity: 0;
				pointer-events: none;
				transition:
					opacity 0.2s ease,
					transform 0.2s ease;
			}
			#toast.show {
				opacity: 1;
				transform: translateX(-50%) translateY(0);
			}

			/* ── Keyboard hints footer ──────────────────────────── */
			#hints {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 20px;
				margin-top: 20px;
				font-size: 11px;
				color: var(--text-faint);
			}
			#hints kbd {
				font-family: inherit;
				font-size: 10px;
				font-weight: 700;
				padding: 2px 6px;
				border: 1px solid var(--border-soft);
				margin-right: 5px;
			}
			#hints span {
				display: inline-flex;
				align-items: center;
			}
		</style>
	</head>
	<body>
		<div class="shell">
			<div class="tag-row">
				<div class="tag-left">
					<span class="tag-new">LIVE</span>
					<span class="tag-label mono">CONTROL PANEL</span>
				</div>
				<!-- Replace the theme-toggle button markup with this -->
				<button
					class="theme-toggle"
					id="themeToggle"
					aria-label="Cycle theme (auto/light/dark)"
				>
					<svg
						class="icon-auto"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<circle cx="12" cy="12" r="9" />
						<path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none" />
					</svg>
					<svg
						class="icon-sun"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
					>
						<circle cx="12" cy="12" r="4" />
						<path
							d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
						/>
					</svg>
					<svg
						class="icon-moon"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
					</svg>
				</button>
			</div>

			<input
				id="search"
				placeholder="John 3:16, a phrase, or keywords…"
				autocomplete="off"
			/>

			<div id="status-bar">
				<div class="status-left">
					<span class="live-dot" id="liveDot"></span>
					<span>Live: <b id="current-book-name">Nothing selected</b></span>
				</div>
			</div>

			<div id="results">
				<div class="empty-state" id="emptyState">
					<svg
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="1.5"
					>
						<circle cx="11" cy="11" r="7" />
						<path d="M21 21l-4.3-4.3" />
					</svg>
					<span>Start typing to search scripture</span>
				</div>
			</div>

			<div id="hints">
				<span><kbd>↑</kbd><kbd>↓</kbd>Navigate</span>
				<span><kbd>Enter</kbd>Send to output</span>
				<span><kbd>Right-click</kbd>Copy verse</span>
			</div>
		</div>

		<div id="contextMenu">
			<div class="menu-item" id="copyItem">
				<svg
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
				>
					<rect x="9" y="9" width="11" height="11" rx="2" />
					<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
				</svg>
				Copy verse
			</div>
		</div>

		<div id="toast">COPIED TO CLIPBOARD</div>

		<script>
			/* Replace the entire theme <script> block (initTheme IIFE + the click listener) with this */
			const themeToggle = document.getElementById("themeToggle");
			const media = window.matchMedia("(prefers-color-scheme: dark)");

			function applyTheme() {
				const mode = localStorage.getItem("themeMode") || "auto";
				const resolved =
					mode === "auto" ? (media.matches ? "dark" : "light") : mode;
				document.documentElement.setAttribute("data-theme", resolved);
				themeToggle.setAttribute("data-mode", mode);
			}

			applyTheme();

			media.addEventListener("change", () => {
				// Only react live if currently in auto mode
				if ((localStorage.getItem("themeMode") || "auto") === "auto") {
					applyTheme();
				}
			});

			themeToggle.addEventListener("click", () => {
				const current = localStorage.getItem("themeMode") || "auto";
				const next =
					current === "auto" ? "light" : current === "light" ? "dark" : "auto";
				localStorage.setItem("themeMode", next);
				applyTheme();
			});

			/* ── App logic (unchanged behavior) ─────────────────── */
			const searchEl = document.getElementById("search");
			const resultsEl = document.getElementById("results");
			const emptyStateEl = document.getElementById("emptyState");
			const currentBookEl = document.getElementById("current-book-name");
			const liveDot = document.getElementById("liveDot");
			const contextMenu = document.getElementById("contextMenu");
			const toast = document.getElementById("toast");

			let ws = null;
			let reconnectTimer = null;
			const messageQueue = [];

			let currentRef = null;
			let focusedIndex = -1;
			let debounce;
			let contextMenuRow = null;

			function getWsUrl() {
				const protocol = location.protocol === "https:" ? "wss:" : "ws:";
				return `${protocol}//${location.host}/ws`;
			}

			function connectWs() {
				if (
					ws &&
					(ws.readyState === WebSocket.OPEN ||
						ws.readyState === WebSocket.CONNECTING)
				) {
					return;
				}
				clearTimeout(reconnectTimer);

				try {
					ws = new WebSocket(getWsUrl());
				} catch (_) {
					scheduleReconnect();
					return;
				}

				ws.onopen = () => {
					clearTimeout(reconnectTimer);
					while (messageQueue.length > 0 && ws.readyState === WebSocket.OPEN) {
						const msg = messageQueue.shift();
						ws.send(msg);
					}
				};

				ws.onmessage = (e) => {
					try {
						const data = JSON.parse(e.data);
						if (data.channel !== "scripture") return;

						if (data.type === "clear") {
							currentRef = null;
							currentBookEl.textContent = "Nothing selected";
							liveDot.classList.remove("on");
							resultsEl
								.querySelectorAll(".result")
								.forEach((el) => el.classList.remove("active"));
							return;
						}

						if (data.book && data.chapter && data.verse) {
							currentRef = `${data.book} ${data.chapter}:${data.verse}`;
							currentBookEl.textContent = currentRef;
							liveDot.classList.add("on");
							const items = resultsEl.querySelectorAll(".result");
							items.forEach((el) => el.classList.remove("active"));
							const clicked = [...items].find((el) =>
								el.textContent.startsWith(currentRef),
							);
							if (clicked) clicked.classList.add("active");
						}
					} catch (_) {}
				};

				ws.onclose = () => {
					scheduleReconnect();
				};

				ws.onerror = () => {
					try {
						ws.close();
					} catch (_) {}
				};
			}

			function scheduleReconnect() {
				clearTimeout(reconnectTimer);
				reconnectTimer = setTimeout(() => {
					connectWs();
				}, 1000);
			}

			function sendWs(data) {
				const payload = typeof data === "string" ? data : JSON.stringify(data);
				if (ws && ws.readyState === WebSocket.OPEN) {
					ws.send(payload);
				} else {
					messageQueue.push(payload);
					connectWs();
				}
			}

			document.addEventListener("visibilitychange", () => {
				if (document.visibilityState === "visible") {
					if (
						!ws ||
						ws.readyState === WebSocket.CLOSED ||
						ws.readyState === WebSocket.CLOSING
					) {
						connectWs();
					}
				}
			});

			window.addEventListener("focus", () => {
				if (
					!ws ||
					ws.readyState === WebSocket.CLOSED ||
					ws.readyState === WebSocket.CLOSING
				) {
					connectWs();
				}
			});

			window.addEventListener("pageshow", () => {
				if (
					!ws ||
					ws.readyState === WebSocket.CLOSED ||
					ws.readyState === WebSocket.CLOSING
				) {
					connectWs();
				}
			});

			connectWs();

			function parseQueryRef(str) {
				const trimmed = str.trim();
				const withVerse = trimmed.match(/^(\s*.*?\S)\s+(\d+)[\s:]+(\d+\s*)$/);
				if (withVerse) {
					return {
						book: withVerse[1].trim(),
						chapter: parseInt(withVerse[2], 10),
						verse: parseInt(withVerse[3].trim(), 10),
						isVerse: true,
					};
				}
				const chapterOnly = trimmed.match(/^(\s*.*?\S)\s+(\d+):?$/);
				if (chapterOnly) {
					return {
						book: chapterOnly[1].trim(),
						chapter: parseInt(chapterOnly[2], 10),
						verse: null,
						isVerse: false,
					};
				}
				return null;
			}

			async function doSearch(q, autoSelectVerse = false) {
				if (!q || !q.trim()) {
					resultsEl.innerHTML = "";
					resultsEl.appendChild(emptyStateEl);
					focusedIndex = -1;
					return [];
				}

				const parsed = parseQueryRef(q);

				if (parsed && parsed.verse !== null) {
					const formatted = `${parsed.book} ${parsed.chapter}:${parsed.verse}`;
					if (
						searchEl.value !== formatted &&
						searchEl.value.trim() !== formatted
					) {
						const isFocused = document.activeElement === searchEl;
						const start = searchEl.selectionStart;
						const end = searchEl.selectionEnd;
						searchEl.value = formatted;
						if (isFocused && start !== null && end !== null) {
							const diff = formatted.length - q.length;
							const newPos = Math.max(
								0,
								Math.min(formatted.length, start + diff),
							);
							searchEl.setSelectionRange(newPos, newPos);
						}
					}
				}

				try {
					const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
					const rows = await res.json();
					renderResults(rows);

					if (
						parsed &&
						parsed.verse !== null &&
						rows.length > 0 &&
						rows[0].type !== "book"
					) {
						const matchIndex = rows.findIndex(
							(r) =>
								r.verse === parsed.verse &&
								(!parsed.book ||
									r.book.toLowerCase() === parsed.book.toLowerCase()),
						);
						if (matchIndex !== -1) {
							setFocus(matchIndex);
							if (autoSelectVerse) {
								const items = resultsEl.querySelectorAll(".result");
								if (items[matchIndex]) items[matchIndex].click();
							}
						} else {
							focusedIndex = -1;
						}
					} else {
						focusedIndex = -1;
					}
					return rows;
				} catch (_) {
					return [];
				}
			}

			searchEl.addEventListener("input", () => {
				clearTimeout(debounce);
				const q = searchEl.value;
				debounce = setTimeout(() => {
					doSearch(q);
				}, 150);
			});

			function renderResults(rows) {
				resultsEl.innerHTML = "";
				if (rows.length === 0) {
					resultsEl.appendChild(emptyStateEl);
					return;
				}
				rows.forEach((row) => {
					const div = document.createElement("div");
					div.className = "result";
					if (row.type === "book") {
						div.textContent = row.name;
						div.dataset.type = "book";
						div.onclick = () => {
							searchEl.value = row.name + " ";
							searchEl.focus();
						};
					} else {
						const ref = `${row.book} ${row.chapter}:${row.verse}`;
						if (ref === currentRef) div.classList.add("active");
						div.innerHTML = `<span class="ref mono">${ref}</span><span>${row.text}</span>`;
						div.dataset.type = "verse";
						div.onclick = () => sendVerse(row);
						div._row = row;
						div.addEventListener("contextmenu", (e) => {
							e.preventDefault();
							contextMenuRow = row;
							contextMenu.style.display = "block";
							contextMenu.style.left = e.pageX + "px";
							contextMenu.style.top = e.pageY + "px";
						});
					}
					resultsEl.appendChild(div);
				});
			}

			document.addEventListener("click", () => {
				contextMenu.style.display = "none";
			});

			document.getElementById("copyItem").addEventListener("click", () => {
				if (!contextMenuRow) return;
				const ref = `${contextMenuRow.book} ${contextMenuRow.chapter}:${contextMenuRow.verse}`;
				navigator.clipboard
					.writeText(`${ref} — ${contextMenuRow.text}`)
					.then(() => {
						toast.classList.add("show");
						setTimeout(() => toast.classList.remove("show"), 1500);
					});
				contextMenu.style.display = "none";
			});

			function sendVerse(row) {
				const nextRef = `${row.book} ${row.chapter}:${row.verse}`;
				currentRef = nextRef;
				currentBookEl.textContent = currentRef;
				liveDot.classList.add("on");
				sendWs({
					channel: "scripture",
					book: row.book,
					chapter: row.chapter,
					verse: row.verse,
					text: row.text,
				});

				const items = resultsEl.querySelectorAll(".result");
				items.forEach((el) => el.classList.remove("active"));
				const clicked = [...items].find((el) =>
					el.textContent.startsWith(currentRef),
				);
				if (clicked) clicked.classList.add("active");
			}

			function setFocus(index) {
				const items = resultsEl.querySelectorAll(".result");
				if (!items.length) return;
				items.forEach((el) => el.classList.remove("focused"));
				focusedIndex = Math.max(0, Math.min(index, items.length - 1));
				const el = items[focusedIndex];
				el.classList.add("focused");
				el.scrollIntoView({ block: "nearest" });
			}

			searchEl.addEventListener("keydown", async (e) => {
				const items = resultsEl.querySelectorAll(".result");
				if (e.key === "ArrowDown") {
					e.preventDefault();
					setFocus(focusedIndex + 1);
				} else if (e.key === "ArrowUp") {
					e.preventDefault();
					setFocus(focusedIndex - 1);
				} else if (e.key === "Enter") {
					e.preventDefault();
					clearTimeout(debounce);

					const q = searchEl.value;
					const parsed = parseQueryRef(q);

					if (parsed && parsed.verse !== null) {
						const formatted = `${parsed.book} ${parsed.chapter}:${parsed.verse}`;
						if (searchEl.value !== formatted) {
							searchEl.value = formatted;
						}

						const matchIndex = [...items].findIndex(
							(el) =>
								el._row &&
								el._row.chapter === parsed.chapter &&
								el._row.verse === parsed.verse &&
								(!parsed.book ||
									el._row.book.toLowerCase() === parsed.book.toLowerCase()),
						);
						if (matchIndex !== -1) {
							focusedIndex = matchIndex;
							items[matchIndex].click();
							items[matchIndex].scrollIntoView({
								block: "start",
								behavior: "smooth",
							});
							return;
						}

						await doSearch(q, true);
						return;
					}

					const target = focusedIndex >= 0 ? items[focusedIndex] : items[0];
					if (target) target.click();
				}
			});

			async function loadDefault() {
				try {
					const res = await fetch(`/api/verse?book=Genesis&chapter=1&verse=1`);
					const row = await res.json();
					if (row && row.text && !currentRef) sendVerse(row);
				} catch (_) {}
			}
			loadDefault();
		</script>
	</body>
</html>
