<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Song Output</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 100%;
				height: 100%;
				background: transparent;
				overflow: hidden;
			}

			/* Background mode: full-screen, same look as scripture output */
			body.bg-mode {
				background: transparent;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			body.bg-mode #wrap {
				width: 85%;
				text-align: center;
			}

			/* Lower mode: transparent, fixed to bottom */
			body.lower-mode {
				display: block;
			}
			body.lower-mode #wrap {
				position: fixed;
				left: 0;
				right: 0;
				bottom: 0;
				padding: 2vh 3vw;
				text-align: center;
			}

			#wrap {
				opacity: 0;
				transform: translateY(12px);
				transition:
					opacity 0.5s ease,
					transform 0.5s ease;
			}
			#wrap.visible {
				opacity: 1;
				transform: translateY(0);
			}

			#lyrics {
				font-family: "Book Antiqua", "Palatino Linotype", "Georgia", "Times New Roman", serif;
				font-weight: bold;
				color: white;
				line-height: 1.38;
				white-space: pre-line;
				text-shadow:
					0 3px 16px rgba(0, 0, 0, 0.9),
					0 0 6px rgba(0, 0, 0, 0.7),
					0 0 2px rgba(0, 0, 0, 0.8);
				word-break: normal;
				overflow-wrap: break-word;
			}
			/* Lower-third: ignore newlines, let text flow & wrap naturally */
			body.lower-mode #lyrics {
				white-space: normal;
			}
			body.bg-mode #lyrics {
				font-size: clamp(22px, min(3.5vw, 5.2vh), 60px);
			}
			body.lower-mode #lyrics {
				font-size: 5.85vh;
			}
		</style>
	</head>
	<body class="lower-mode">
		<div id="wrap">
			<div id="lyrics"></div>
		</div>

		<script>
			const body = document.body;
			const wrap = document.getElementById("wrap");
			const lyricsEl = document.getElementById("lyrics");

			let ws = null;
			let reconnectTimer = null;

			function getWsUrl() {
				const protocol = location.protocol === "https:" ? "wss:" : "ws:";
				return `${protocol}//${location.host}/ws`;
			}

			function ensureFits() {
				const isBg = body.classList.contains("bg-mode");

				// Reset overrides
				lyricsEl.style.fontSize = "";
				lyricsEl.style.transform = "";
				lyricsEl.style.transformOrigin = "";

				if (isBg) {
					// bg-mode: binary-search fill-to-fit
					const maxH = window.innerHeight * 0.88;
					const maxW = window.innerWidth * 0.88;
					const baseSize = parseFloat(window.getComputedStyle(lyricsEl).fontSize) || 32;
					let lo = 10, hi = Math.max(baseSize, 120);
					lyricsEl.style.fontSize = hi + "px";
					while (lyricsEl.scrollHeight <= maxH && lyricsEl.scrollWidth <= maxW && hi < 300) {
						hi *= 1.5;
						lyricsEl.style.fontSize = hi + "px";
					}
					let best = lo;
					for (let i = 0; i < 20; i++) {
						const mid = Math.floor((lo + hi) / 2);
						if (mid === lo) break;
						lyricsEl.style.fontSize = mid + "px";
						if (lyricsEl.scrollHeight <= maxH && lyricsEl.scrollWidth <= maxW) {
							best = mid; lo = mid;
						} else {
							hi = mid;
						}
					}
					lyricsEl.style.fontSize = best + "px";
				} else {
					// lower-mode: CSS sets a large vh-based font; only scale DOWN if it overflows.
					// We use transform:scale so OBS layout is never broken.
					const maxH = window.innerHeight * 0.88;
					const maxW = window.innerWidth * 0.96;
					const h = lyricsEl.scrollHeight;
					const w = lyricsEl.scrollWidth;
					if (h > maxH || w > maxW) {
						const scale = Math.min(maxH / h, maxW / w);
						lyricsEl.style.transformOrigin = "bottom center";
						lyricsEl.style.transform = `scale(${scale})`;
					}
				}
			}

			let resizeRaf = null;
			window.addEventListener("resize", () => {
				if (resizeRaf) cancelAnimationFrame(resizeRaf);
				resizeRaf = requestAnimationFrame(() => {
					ensureFits();
				});
			});

			function connect() {
				if (
					ws &&
					(ws.readyState === WebSocket.OPEN ||
						ws.readyState === WebSocket.CONNECTING)
				) {
					return;
				}
				clearTimeout(reconnectTimer);

				try {
					ws = new WebSocket(getWsUrl());
				} catch (_) {
					scheduleReconnect();
					return;
				}

				ws.onmessage = (e) => {
					try {
						const data = JSON.parse(e.data);
						if (data.channel !== "song") return;

						if (data.type === "clear") {
							wrap.classList.remove("visible");
							return;
						}

						body.className =
							data.mode === "background" ? "bg-mode" : "lower-mode";
						wrap.classList.remove("visible");
						setTimeout(() => {
							lyricsEl.textContent = data.text;
							ensureFits();
							wrap.classList.add("visible");
						}, 200);
					} catch (_) {}
				};

				ws.onclose = () => {
					scheduleReconnect();
				};

				ws.onerror = () => {
					try {
						ws.close();
					} catch (_) {}
				};
			}

			function scheduleReconnect() {
				clearTimeout(reconnectTimer);
				reconnectTimer = setTimeout(connect, 1000);
			}

			document.addEventListener("visibilitychange", () => {
				if (document.visibilityState === "visible") {
					if (
						!ws ||
						ws.readyState === WebSocket.CLOSED ||
						ws.readyState === WebSocket.CLOSING
					) {
						connect();
					}
				}
			});

			window.addEventListener("focus", () => {
				if (
					!ws ||
					ws.readyState === WebSocket.CLOSED ||
					ws.readyState === WebSocket.CLOSING
				) {
					connect();
				}
			});

			window.addEventListener("pageshow", () => {
				if (
					!ws ||
					ws.readyState === WebSocket.CLOSED ||
					ws.readyState === WebSocket.CLOSING
				) {
					connect();
				}
			});

			connect();
		</script>
	</body>
</html>
