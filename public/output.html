<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 100%;
				height: 100%;
				background: transparent;
			}
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				overflow: hidden;
			}
			#wrap {
				width: 85%;
				text-align: center;
				opacity: 0;
				transform: translateY(10px);
				transition:
					opacity 0.5s ease,
					transform 0.5s ease;
			}
			#wrap.visible {
				opacity: 1;
				transform: translateY(0);
			}
			#wrap.hidden {
				opacity: 0;
				pointer-events: none;
			}
			#verse {
				font-family: "Book Antiqua", "Palatino Linotype", serif;
				font-size: clamp(28px, 4.5vw, 72px);
				font-weight: bold;
				color: white;
				line-height: 1.4;
				text-shadow:
					0 3px 16px rgba(0, 0, 0, 0.9),
					0 0 6px rgba(0, 0, 0, 0.7),
					0 0 2px rgba(0, 0, 0, 0.8);
			}
			#ref {
				margin-top: 1.5vw;
				font-family: "Book Antiqua", "Palatino Linotype", serif;
				font-size: clamp(28px, 4.5vw, 72px);
				font-weight: bold;
				color: #e8d9a0;
				text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
			}
		</style>
	</head>
	<body>
		<div id="wrap" class="hidden">
			<div id="verse"></div>
			<div id="ref"></div>
		</div>

		<script>
			const wrap = document.getElementById("wrap");
			const verseEl = document.getElementById("verse");
			const refEl = document.getElementById("ref");

			function connect() {
				const ws = new WebSocket(`ws://${location.host}/ws`);
				ws.onmessage = (e) => {
					const data = JSON.parse(e.data);
					if (data.channel !== "scripture") return;
					if (data.type === "clear") {
						wrap.classList.remove("visible");
						wrap.classList.add("hidden");
						return;
					}
					wrap.classList.remove("visible");
					wrap.classList.add("hidden");
					setTimeout(() => {
						verseEl.textContent = data.text;
						refEl.textContent = `${data.book} ${data.chapter}:${data.verse}`;
						wrap.classList.remove("hidden");
						wrap.classList.add("visible");
					}, 200);
				};
				ws.onclose = () => setTimeout(connect, 1000);
			}
			connect();
		</script>
	</body>
</html>
