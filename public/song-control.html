<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Song Control</title>
		<style>
			:root {
				--bg-color: #f7f6f3;
				--text-color: #2b2b2b;
				--heading-color: #6b6558;
				--panel-bg: #ffffff;
				--panel-border: #e4e1d9;
				--item-border: #edeae2;
				--item-hover: #faf8f3;
				--item-selected-bg: #fbf2dd;
				--item-selected-border: #c99a3f;
				--tag-color: #888888;
				--btn-bg: #e4e1d9;
				--btn-hover: #d8d4c9;
				--btn-text: #2b2b2b;
				--new-btn-bg: #2b4a5a;
				--new-btn-hover: #2f5a6b;
				--new-btn-text: #ffffff;
				--input-bg: #ffffff;
				--input-border: #d8d5cf;
				--input-focus-border: #b8965a;
				--input-focus-ring: rgba(184, 150, 90, 0.2);
				--mode-label-border: #e4e1d9;
				--mode-checked-text: #a3781f;
				--mode-checked-border: #c99a3f;
				--mode-checked-bg: #fdf7ea;
				--add-sec-bg: #eef2fb;
				--add-sec-hover: #dde6f7;
				--add-sec-text: #3a5a9a;
				--save-btn-bg: #2b5a2b;
				--save-btn-hover: #2f6b2f;
				--save-btn-text: #ffffff;
				--live-label-color: #a3781f;
				--live-lines-color: #444444;
				--clear-bg: #f1d9d9;
				--clear-hover: #e8c8c8;
				--clear-text: #7a2b2b;
				--edit-btn-bg: #eef2fb;
				--edit-btn-hover: #dde6f7;
				--edit-btn-text: #3a5a9a;
				--delete-btn-bg: #fdf2f2;
				--delete-btn-hover: #fee2e2;
				--delete-btn-text: #b91c1c;
				--delete-btn-border: #fca5a5;
				--toast-bg: #2b2b2b;
				--toast-text: #ffffff;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--bg-color: #121417;
					--text-color: #e2e8f0;
					--heading-color: #94a3b8;
					--panel-bg: #1a1d24;
					--panel-border: #2d333f;
					--item-border: #262c38;
					--item-hover: #222731;
					--item-selected-bg: #2d2618;
					--item-selected-border: #d4a359;
					--tag-color: #94a3b8;
					--btn-bg: #2a303c;
					--btn-hover: #353d4d;
					--btn-text: #e2e8f0;
					--new-btn-bg: #2b5a9e;
					--new-btn-hover: #366ac0;
					--new-btn-text: #ffffff;
					--input-bg: #1a1d24;
					--input-border: #2d333f;
					--input-focus-border: #d4a359;
					--input-focus-ring: rgba(212, 163, 89, 0.25);
					--mode-label-border: #2d333f;
					--mode-checked-text: #e5b367;
					--mode-checked-border: #d4a359;
					--mode-checked-bg: #2d2618;
					--add-sec-bg: #1c273c;
					--add-sec-hover: #263654;
					--add-sec-text: #7ca2f4;
					--save-btn-bg: #216e39;
					--save-btn-hover: #288545;
					--save-btn-text: #ffffff;
					--live-label-color: #e5b367;
					--live-lines-color: #cbd5e1;
					--clear-bg: #401e22;
					--clear-hover: #54272c;
					--clear-text: #f87171;
					--edit-btn-bg: #1c273c;
					--edit-btn-hover: #263654;
					--edit-btn-text: #7ca2f4;
					--delete-btn-bg: #3b181c;
					--delete-btn-hover: #4c1d22;
					--delete-btn-text: #f87171;
					--delete-btn-border: #7f1d1d;
					--toast-bg: #e2e8f0;
					--toast-text: #121417;
				}
			}

			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				font-family: "Segoe UI", "Inter", system-ui, sans-serif;
				background: var(--bg-color);
				color: var(--text-color);
				padding: 28px;
				display: flex;
				gap: 24px;
				transition: background 0.2s ease, color 0.2s ease;
			}
			#left {
				width: 280px;
				flex-shrink: 0;
			}
			#right {
				flex: 1;
				min-width: 0;
			}

			h2 {
				font-size: 16px;
				margin-bottom: 10px;
				color: var(--heading-color);
				font-weight: 600;
			}

			#songList {
				background: var(--panel-bg);
				border: 1px solid var(--panel-border);
				border-radius: 10px;
				overflow-y: auto;
				max-height: calc(100vh - 120px);
				transition: background 0.2s ease, border-color 0.2s ease;
			}
			.song-item {
				padding: 12px 14px;
				border-bottom: 1px solid var(--item-border);
				cursor: pointer;
				transition: background 0.15s ease, border-color 0.15s ease;
			}
			.song-item:last-child {
				border-bottom: none;
			}
			.song-item:hover {
				background: var(--item-hover);
			}
			.song-item.selected {
				background: var(--item-selected-bg);
				border-left: 4px solid var(--item-selected-border);
			}
			.song-item .mode-tag {
				font-size: 11px;
				color: var(--tag-color);
				display: block;
				margin-top: 2px;
			}

			button {
				padding: 10px 16px;
				border: none;
				border-radius: 8px;
				background: var(--btn-bg);
				color: var(--btn-text);
				cursor: pointer;
				font-size: 14px;
				font-weight: 500;
				transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
			}
			button:hover {
				background: var(--btn-hover);
			}
			#newSongBtn {
				width: 100%;
				margin-bottom: 12px;
				background: var(--new-btn-bg);
				color: var(--new-btn-text);
			}
			#newSongBtn:hover {
				background: var(--new-btn-hover);
			}

			/* Song builder */
			#builder {
				background: var(--panel-bg);
				border: 1px solid var(--panel-border);
				border-radius: 10px;
				padding: 20px;
				display: none;
				transition: background 0.2s ease, border-color 0.2s ease;
			}
			#builder.active {
				display: block;
			}
			.builder-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 14px;
			}
			.builder-header h2 {
				margin-bottom: 0;
			}
			#builder input[type="text"] {
				width: 100%;
				font-size: 18px;
				padding: 10px 12px;
				border-radius: 8px;
				border: 1px solid var(--input-border);
				background: var(--input-bg);
				color: var(--text-color);
				margin-bottom: 12px;
			}
			#builder input[type="text"]:focus,
			.section-block input[type="text"]:focus,
			.section-block textarea:focus {
				outline: none;
				border-color: var(--input-focus-border);
				box-shadow: 0 0 0 3px var(--input-focus-ring);
			}
			.mode-choice {
				display: flex;
				gap: 10px;
				margin-bottom: 16px;
			}
			.mode-choice label {
				flex: 1;
				padding: 12px;
				border: 2px solid var(--mode-label-border);
				border-radius: 8px;
				cursor: pointer;
				text-align: center;
				font-size: 14px;
				color: var(--text-color);
				transition: background 0.15s ease, border-color 0.15s ease;
			}
			.mode-choice input {
				display: none;
			}
			.mode-choice input:checked + span {
				color: var(--mode-checked-text);
				font-weight: 600;
			}
			.mode-choice label:has(input:checked) {
				border-color: var(--mode-checked-border);
				background: var(--mode-checked-bg);
			}

			.section-block {
				border: 1px solid var(--panel-border);
				border-radius: 8px;
				padding: 14px;
				margin-bottom: 12px;
				background: var(--panel-bg);
			}
			.section-block-header {
				display: flex;
				gap: 10px;
				align-items: center;
				margin-bottom: 8px;
			}
			.section-block-header input[type="text"] {
				font-size: 15px;
				font-weight: 600;
				margin-bottom: 0 !important;
				flex: 1;
			}
			.remove-sec-btn {
				padding: 8px 12px;
				background: var(--delete-btn-bg);
				border: 1px solid var(--delete-btn-border);
				color: var(--delete-btn-text);
				border-radius: 6px;
				cursor: pointer;
				font-size: 13px;
				font-weight: 600;
			}
			.remove-sec-btn:hover {
				background: var(--delete-btn-hover);
			}
			.section-block textarea {
				width: 100%;
				min-height: 90px;
				font-size: 15px;
				padding: 10px;
				border-radius: 6px;
				border: 1px solid var(--input-border);
				background: var(--input-bg);
				color: var(--text-color);
				font-family: inherit;
				resize: vertical;
			}
			#addSectionBtn {
				background: var(--add-sec-bg);
				color: var(--add-sec-text);
			}
			#addSectionBtn:hover {
				background: var(--add-sec-hover);
			}
			.builder-footer {
				display: flex;
				gap: 10px;
				margin-top: 16px;
			}
			#saveSongBtn {
				background: var(--save-btn-bg);
				color: var(--save-btn-text);
			}
			#saveSongBtn:hover {
				background: var(--save-btn-hover);
			}

			/* Live song view */
			#liveView {
				background: var(--panel-bg);
				border: 1px solid var(--panel-border);
				border-radius: 10px;
				padding: 20px;
				transition: background 0.2s ease, border-color 0.2s ease;
			}
			.live-header {
				display: flex;
				justify-content: space-between;
				align-items: flex-start;
				margin-bottom: 16px;
				gap: 12px;
			}
			.live-header-info {
				flex: 1;
				min-width: 0;
			}
			.live-header-info h2 {
				margin-bottom: 4px;
				word-break: break-word;
			}
			.mode-badge {
				font-size: 12px;
				color: var(--tag-color);
				font-weight: 500;
			}
			.live-actions {
				display: flex;
				gap: 8px;
				flex-shrink: 0;
			}
			#editSongBtn {
				background: var(--edit-btn-bg);
				color: var(--edit-btn-text);
			}
			#editSongBtn:hover {
				background: var(--edit-btn-hover);
			}
			#deleteSongBtn {
				background: var(--delete-btn-bg);
				border: 1px solid var(--delete-btn-border);
				color: var(--delete-btn-text);
			}
			#deleteSongBtn:hover {
				background: var(--delete-btn-hover);
			}
			.live-section {
				padding: 12px 14px;
				border-bottom: 1px solid var(--item-border);
				cursor: pointer;
				border-radius: 6px;
				transition: background 0.15s ease;
			}
			.live-section:hover {
				background: var(--item-hover);
			}
			.live-section.active {
				background: var(--item-selected-bg);
				border-left: 4px solid var(--item-selected-border);
			}
			.live-section .label {
				font-weight: 600;
				color: var(--live-label-color);
				display: block;
				margin-bottom: 6px;
			}
			.live-section .lines {
				white-space: pre-line;
				color: var(--live-lines-color);
			}

			#clearBtn {
				background: var(--clear-bg);
				color: var(--clear-text);
				margin-top: 16px;
			}
			#clearBtn:hover {
				background: var(--clear-hover);
			}

			#toast {
				position: fixed;
				bottom: 24px;
				left: 50%;
				transform: translateX(-50%) translateY(20px);
				background: var(--toast-bg);
				color: var(--toast-text);
				padding: 10px 18px;
				border-radius: 8px;
				font-size: 14px;
				font-weight: 500;
				opacity: 0;
				pointer-events: none;
				transition:
					opacity 0.25s ease,
					transform 0.25s ease;
				z-index: 1000;
			}
			#toast.show {
				opacity: 1;
				transform: translateX(-50%) translateY(0);
			}
		</style>
	</head>
	<body>
		<div id="left">
			<h2>Songs</h2>
			<button id="newSongBtn">+ New Song</button>
			<div id="songList"></div>
		</div>

		<div id="right">
			<div id="builder">
				<div class="builder-header">
					<h2 id="builderHeading">New Song</h2>
					<button type="button" id="cancelBuilderBtn">Cancel</button>
				</div>
				<input type="text" id="titleInput" placeholder="Song title" />
				<div class="mode-choice">
					<label>
						<input type="radio" name="mode" value="background" checked />
						<span>With Background</span>
					</label>
					<label>
						<input type="radio" name="mode" value="lower" />
						<span>Lower Transparent</span>
					</label>
				</div>
				<div id="sectionsWrap"></div>
				<button id="addSectionBtn">+ Add Section</button>
				<div class="builder-footer">
					<button id="saveSongBtn">Save Song</button>
					<button type="button" id="cancelBuilderBtn2">Cancel</button>
				</div>
			</div>

			<div id="liveView" style="display: none">
				<div class="live-header">
					<div class="live-header-info">
						<h2 id="liveTitleLabel"></h2>
						<span id="liveModeBadge" class="mode-badge"></span>
					</div>
					<div class="live-actions">
						<button id="editSongBtn">Edit Song</button>
						<button id="deleteSongBtn">Delete</button>
					</div>
				</div>
				<div id="liveSections"></div>
				<button id="clearBtn">Clear Output</button>
			</div>
		</div>

		<div id="toast"></div>

		<script>
			const songListEl = document.getElementById("songList");
			const builder = document.getElementById("builder");
			const builderHeading = document.getElementById("builderHeading");
			const titleInput = document.getElementById("titleInput");
			const saveSongBtn = document.getElementById("saveSongBtn");
			const liveView = document.getElementById("liveView");
			const liveTitleLabel = document.getElementById("liveTitleLabel");
			const liveModeBadge = document.getElementById("liveModeBadge");
			const liveSections = document.getElementById("liveSections");
			const sectionsWrap = document.getElementById("sectionsWrap");
			const toast = document.getElementById("toast");

			let ws = null;
			let reconnectTimer = null;
			const messageQueue = [];

			let selectedSongId = null;
			let currentSongData = null;
			let editingSongId = null;
			let activeSectionIndex = -1;

			function showToast(message) {
				toast.textContent = message;
				toast.classList.add("show");
				setTimeout(() => toast.classList.remove("show"), 2000);
			}

			function getWsUrl() {
				const protocol = location.protocol === "https:" ? "wss:" : "ws:";
				return `${protocol}//${location.host}/ws`;
			}

			function connectWs() {
				if (
					ws &&
					(ws.readyState === WebSocket.OPEN ||
						ws.readyState === WebSocket.CONNECTING)
				) {
					return;
				}
				clearTimeout(reconnectTimer);

				try {
					ws = new WebSocket(getWsUrl());
				} catch (_) {
					scheduleReconnect();
					return;
				}

				ws.onopen = () => {
					clearTimeout(reconnectTimer);
					while (messageQueue.length > 0 && ws.readyState === WebSocket.OPEN) {
						const msg = messageQueue.shift();
						ws.send(msg);
					}
				};

				ws.onmessage = (e) => {
					try {
						const data = JSON.parse(e.data);
						if (data.channel !== "song") return;

						if (data.type === "clear") {
							activeSectionIndex = -1;
							document
								.querySelectorAll(".live-section")
								.forEach((el) => el.classList.remove("active"));
							return;
						}

						if (data.text) {
							const sections = [...liveSections.children];
							sections.forEach((el, i) => {
								const linesEl = el.querySelector(".lines");
								if (linesEl && linesEl.textContent === data.text) {
									activeSectionIndex = i;
									el.classList.add("active");
								} else {
									el.classList.remove("active");
								}
							});
						}
					} catch (_) {}
				};

				ws.onclose = () => {
					scheduleReconnect();
				};

				ws.onerror = () => {
					try {
						ws.close();
					} catch (_) {}
				};
			}

			function scheduleReconnect() {
				clearTimeout(reconnectTimer);
				reconnectTimer = setTimeout(() => {
					connectWs();
				}, 1000);
			}

			function sendWs(data) {
				const payload = typeof data === "string" ? data : JSON.stringify(data);
				if (ws && ws.readyState === WebSocket.OPEN) {
					ws.send(payload);
				} else {
					messageQueue.push(payload);
					connectWs();
				}
			}

			document.addEventListener("visibilitychange", () => {
				if (document.visibilityState === "visible") {
					if (
						!ws ||
						ws.readyState === WebSocket.CLOSED ||
						ws.readyState === WebSocket.CLOSING
					) {
						connectWs();
					}
					loadSongs();
				}
			});

			window.addEventListener("focus", () => {
				if (
					!ws ||
					ws.readyState === WebSocket.CLOSED ||
					ws.readyState === WebSocket.CLOSING
				) {
					connectWs();
				}
			});

			window.addEventListener("pageshow", () => {
				if (
					!ws ||
					ws.readyState === WebSocket.CLOSED ||
					ws.readyState === WebSocket.CLOSING
				) {
					connectWs();
				}
			});

			connectWs();

			async function loadSongs() {
				try {
					const res = await fetch("/api/songs");
					const songs = await res.json();
					songListEl.innerHTML = "";
					songs.forEach((song) => {
						const div = document.createElement("div");
						div.className = "song-item";
						if (song.id === selectedSongId) div.classList.add("selected");
						div.innerHTML = `${escapeHtml(song.title)}<span class="mode-tag">${song.display_mode === "background" ? "With Background" : "Lower Transparent"}</span>`;
						div.onclick = () => openSong(song.id);
						songListEl.appendChild(div);
					});
				} catch (_) {}
			}

			function escapeHtml(text) {
				const div = document.createElement("div");
				div.textContent = text ?? "";
				return div.innerHTML;
			}

			function addSectionBlock(label = "", lines = "") {
				const div = document.createElement("div");
				div.className = "section-block";
				div.innerHTML = `
					<div class="section-block-header">
						<input type="text" class="sec-label" placeholder="Section name (e.g. Verse 1, Chorus)" value="${escapeHtml(label)}" />
						<button type="button" class="remove-sec-btn" title="Remove section">✕</button>
					</div>
					<textarea class="sec-lines" placeholder="Type lyric lines for this section, one per line">${escapeHtml(lines)}</textarea>
				`;

				div.querySelector(".remove-sec-btn").onclick = () => {
					div.remove();
					if (sectionsWrap.children.length === 0) {
						addSectionBlock();
					}
				};

				sectionsWrap.appendChild(div);
			}

			document.getElementById("addSectionBtn").onclick = () => addSectionBlock();

			document.getElementById("newSongBtn").onclick = () => {
				editingSongId = null;
				builderHeading.textContent = "New Song";
				saveSongBtn.textContent = "Save Song";
				titleInput.value = "";
				document.querySelector('input[name="mode"][value="background"]').checked = true;
				sectionsWrap.innerHTML = "";
				addSectionBlock();

				liveView.style.display = "none";
				builder.classList.add("active");
				titleInput.focus();
			};

			function cancelBuilder() {
				builder.classList.remove("active");
				if (selectedSongId && currentSongData) {
					liveView.style.display = "block";
				} else {
					liveView.style.display = "none";
				}
			}

			document.getElementById("cancelBuilderBtn").onclick = cancelBuilder;
			document.getElementById("cancelBuilderBtn2").onclick = cancelBuilder;

			document.getElementById("editSongBtn").onclick = () => {
				if (!currentSongData) return;
				editingSongId = currentSongData.id;
				builderHeading.textContent = `Edit Song: ${currentSongData.title}`;
				saveSongBtn.textContent = "Save Changes";
				titleInput.value = currentSongData.title;

				const modeRadio = document.querySelector(`input[name="mode"][value="${currentSongData.display_mode}"]`);
				if (modeRadio) modeRadio.checked = true;

				sectionsWrap.innerHTML = "";
				if (currentSongData.sections && currentSongData.sections.length > 0) {
					currentSongData.sections.forEach((sec) => {
						const linesText = sec.lines.map((l) => l.text).join("\n");
						addSectionBlock(sec.label, linesText);
					});
				} else {
					addSectionBlock();
				}

				liveView.style.display = "none";
				builder.classList.add("active");
				titleInput.focus();
			};

			document.getElementById("deleteSongBtn").onclick = async () => {
				if (!selectedSongId || !currentSongData) return;
				const confirmed = confirm(`Are you sure you want to delete "${currentSongData.title}"?`);
				if (!confirmed) return;

				try {
					const res = await fetch(`/api/songs/${selectedSongId}`, { method: "DELETE" });
					if (res.ok) {
						showToast("Song deleted");
						sendWs({ channel: "song", type: "clear" });
						selectedSongId = null;
						currentSongData = null;
						activeSectionIndex = -1;
						liveView.style.display = "none";
						builder.classList.remove("active");
						loadSongs();
					} else {
						alert("Failed to delete song");
					}
				} catch (_) {
					alert("Network error while deleting song");
				}
			};

			saveSongBtn.onclick = async () => {
				const title = titleInput.value.trim();
				if (!title) return alert("Enter a song title");
				const mode = document.querySelector("input[name=mode]:checked").value;

				const blocks = [...sectionsWrap.querySelectorAll(".section-block")];
				const sections = blocks
					.map((b) => {
						const label =
							b.querySelector(".sec-label").value.trim() || "Section";
						const lines = b
							.querySelector(".sec-lines")
							.value.split("\n")
							.map((l) => l.trim())
							.filter(Boolean);
						return { label, lines };
					})
					.filter((s) => s.lines.length > 0);

				if (!sections.length)
					return alert("Add at least one section with lyrics");

				try {
					if (editingSongId !== null) {
						// Update existing song
						const res = await fetch(`/api/songs/${editingSongId}`, {
							method: "PUT",
							headers: { "Content-Type": "application/json" },
							body: JSON.stringify({ title, display_mode: mode, sections }),
						});
						if (!res.ok) throw new Error("Failed to update song");
						showToast("Song updated successfully");
						builder.classList.remove("active");
						await loadSongs();
						await openSong(editingSongId);
					} else {
						// Create new song
						const res = await fetch("/api/songs", {
							method: "POST",
							headers: { "Content-Type": "application/json" },
							body: JSON.stringify({ title, display_mode: mode, sections }),
						});
						if (!res.ok) throw new Error("Failed to create song");
						const data = await res.json();
						showToast("Song created successfully");
						builder.classList.remove("active");
						await loadSongs();
						if (data && data.id) {
							await openSong(data.id);
						}
					}
				} catch (err) {
					alert(err.message || "Failed to save song");
				}
			};

			async function openSong(id) {
				selectedSongId = id;
				activeSectionIndex = -1;
				builder.classList.remove("active");
				liveView.style.display = "block";

				try {
					const res = await fetch(`/api/songs/${id}`);
					const song = await res.json();
					currentSongData = song;

					liveTitleLabel.textContent = song.title;
					liveModeBadge.textContent = song.display_mode === "background" ? "With Background" : "Lower Transparent";
					liveSections.innerHTML = "";

					if (song.sections) {
						song.sections.forEach((sec, i) => {
							const div = document.createElement("div");
							div.className = "live-section";
							const linesText = sec.lines.map((l) => l.text).join("\n");
							div.innerHTML = `<span class="label">${escapeHtml(sec.label)}</span><span class="lines">${escapeHtml(linesText)}</span>`;
							div.onclick = () => {
								activeSectionIndex = i;
								[...liveSections.children].forEach((el) =>
									el.classList.remove("active"),
								);
								div.classList.add("active");
								sendWs({
									channel: "song",
									mode: song.display_mode,
									text: linesText,
								});
							};
							liveSections.appendChild(div);
						});
					}

					loadSongs();
				} catch (_) {}
			}

			document.getElementById("clearBtn").onclick = () => {
				activeSectionIndex = -1;
				sendWs({ channel: "song", type: "clear" });
				document
					.querySelectorAll(".live-section")
					.forEach((el) => el.classList.remove("active"));
			};

			loadSongs();
		</script>
	</body>
</html>
