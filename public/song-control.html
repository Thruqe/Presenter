<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Song Control</title>
		<style>
			:root {
				--bg: #ffffff;
				--surface: #ffffff;
				--surface-alt: #f4f4f4;
				--text: #0a0a0a;
				--text-muted: #6b6b6b;
				--text-faint: #a3a3a3;
				--border: #0a0a0a;
				--border-soft: #d9d9d9;
				--accent: #ec1e79;
				--accent-contrast: #ffffff;
				--live-soft: #f4f4f4;
				--danger: #ec1e3a;
			}

			html[data-theme="dark"] {
				--bg: #000000;
				--surface: #0a0a0a;
				--surface-alt: #131313;
				--text: #f5f5f5;
				--text-muted: #9a9a9a;
				--text-faint: #5c5c5c;
				--border: #f5f5f5;
				--border-soft: #2a2a2a;
				--accent: #ff2f8e;
				--accent-contrast: #000000;
				--live-soft: #131313;
				--danger: #ff5566;
			}

			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html {
				color-scheme: light dark;
			}

			body {
				font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
				-webkit-font-smoothing: antialiased;
				padding: 40px 28px;
				display: flex;
				gap: 28px;
				max-width: 1180px;
				margin: 0 auto;
				transition:
					background 0.2s ease,
					color 0.2s ease;
			}

			.mono {
				font-family:
					"SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", Menlo,
					monospace;
			}

			/* ── Tag row / toggle (shared pattern with control.html) ── */
			.tag-row {
				display: flex;
				align-items: center;
				justify-content: space-between;
				margin-bottom: 24px;
				padding-bottom: 18px;
				border-bottom: 1px solid var(--border);
			}
			.tag-left {
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.tag-new {
				background: var(--accent);
				color: var(--accent-contrast);
				font-size: 11px;
				font-weight: 800;
				letter-spacing: 0.04em;
				padding: 3px 8px;
			}
			.tag-label {
				font-size: 12px;
				font-weight: 700;
				letter-spacing: 0.06em;
				color: var(--text-muted);
			}
			.theme-toggle {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 32px;
				height: 32px;
				border: 1px solid var(--border);
				background: var(--bg);
				color: var(--text);
				cursor: pointer;
				transition:
					background 0.12s ease,
					color 0.12s ease;
			}
			.theme-toggle:hover {
				background: var(--text);
				color: var(--bg);
			}
			.theme-toggle svg {
				width: 15px;
				height: 15px;
			}
			.theme-toggle .icon-sun,
			.theme-toggle .icon-moon,
			.theme-toggle .icon-auto {
				display: none;
			}
			.theme-toggle[data-mode="auto"] .icon-auto {
				display: block;
			}
			.theme-toggle[data-mode="light"] .icon-sun {
				display: block;
			}
			.theme-toggle[data-mode="dark"] .icon-moon {
				display: block;
			}

			#left {
				width: 300px;
				flex-shrink: 0;
			}
			#right {
				flex: 1;
				min-width: 0;
			}

			h2 {
				font-size: 12px;
				font-weight: 700;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				margin-bottom: 12px;
				color: var(--text-muted);
			}

			#songList {
				background: var(--surface);
				border: 1px solid var(--border);
				overflow-y: auto;
				max-height: calc(100vh - 220px);
				transition:
					background 0.2s ease,
					border-color 0.2s ease;
			}
			.song-item {
				padding: 13px 14px;
				border-bottom: 1px solid var(--border-soft);
				cursor: pointer;
				transition: background 0.12s ease;
			}
			.song-item:last-child {
				border-bottom: none;
			}
			.song-item:hover {
				background: var(--surface-alt);
			}
			.song-item.selected {
				background: var(--live-soft);
				border-left: 3px solid var(--accent);
			}
			.song-item .mode-tag {
				font-size: 11px;
				color: var(--text-faint);
				display: block;
				margin-top: 3px;
			}

			button {
				font-family: inherit;
				padding: 10px 16px;
				border: 1px solid var(--border);
				background: var(--bg);
				color: var(--text);
				cursor: pointer;
				font-size: 13px;
				font-weight: 700;
				transition:
					background 0.12s ease,
					color 0.12s ease,
					border-color 0.12s ease;
			}
			button:hover {
				background: var(--surface-alt);
			}

			#newSongBtn {
				width: 100%;
				margin-bottom: 14px;
				background: var(--text);
				color: var(--bg);
				border-color: var(--text);
			}
			#newSongBtn:hover {
				background: var(--accent);
				border-color: var(--accent);
				color: var(--accent-contrast);
			}

			/* ── Song builder ─────────────────────────────────────── */
			#builder {
				background: var(--surface);
				border: 1px solid var(--border);
				padding: 22px;
				display: none;
				transition:
					background 0.2s ease,
					border-color 0.2s ease;
			}
			#builder.active {
				display: block;
			}
			.builder-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 16px;
			}
			.builder-header h2 {
				margin-bottom: 0;
			}

			#builder input[type="text"] {
				width: 100%;
				font-size: 17px;
				font-weight: 500;
				padding: 12px 14px;
				border: 1px solid var(--border);
				background: var(--bg);
				color: var(--text);
				margin-bottom: 14px;
			}
			#builder input[type="text"]:focus,
			.section-block input[type="text"]:focus,
			.section-block textarea:focus {
				outline: none;
				box-shadow: inset 0 0 0 2px var(--accent);
			}

			.mode-choice {
				display: flex;
				gap: 10px;
				margin-bottom: 18px;
			}
			.mode-choice label {
				flex: 1;
				padding: 13px;
				border: 1px solid var(--border);
				cursor: pointer;
				text-align: center;
				font-size: 13px;
				font-weight: 600;
				color: var(--text-muted);
				transition:
					background 0.12s ease,
					color 0.12s ease;
			}
			.mode-choice input {
				display: none;
			}
			.mode-choice label:has(input:checked) {
				background: var(--text);
				color: var(--bg);
			}

			.section-block {
				border: 1px solid var(--border-soft);
				padding: 14px;
				margin-bottom: 12px;
				background: var(--bg);
			}
			.section-block-header {
				display: flex;
				gap: 10px;
				align-items: center;
				margin-bottom: 8px;
			}
			.section-block-header input[type="text"] {
				font-size: 14px;
				font-weight: 700;
				margin-bottom: 0 !important;
				flex: 1;
			}
			.remove-sec-btn {
				padding: 8px 12px;
				background: var(--bg);
				border: 1px solid var(--danger);
				color: var(--danger);
				cursor: pointer;
				font-size: 12px;
				font-weight: 700;
			}
			.remove-sec-btn:hover {
				background: var(--danger);
				color: #fff;
			}

			.section-block textarea {
				width: 100%;
				min-height: 90px;
				font-size: 14px;
				padding: 10px;
				border: 1px solid var(--border-soft);
				background: var(--bg);
				color: var(--text);
				font-family: inherit;
				resize: vertical;
			}

			#addSectionBtn {
				background: var(--bg);
			}

			.builder-footer {
				display: flex;
				gap: 10px;
				margin-top: 18px;
			}
			#saveSongBtn {
				background: var(--text);
				color: var(--bg);
				border-color: var(--text);
			}
			#saveSongBtn:hover {
				background: var(--accent);
				border-color: var(--accent);
				color: var(--accent-contrast);
			}

			/* ── Live song view ─────────────────────────────────── */
			#liveView {
				background: var(--surface);
				border: 1px solid var(--border);
				padding: 22px;
				transition:
					background 0.2s ease,
					border-color 0.2s ease;
			}
			.live-header {
				display: flex;
				justify-content: space-between;
				align-items: flex-start;
				margin-bottom: 18px;
				gap: 12px;
				padding-bottom: 16px;
				border-bottom: 1px solid var(--border-soft);
			}
			.live-header-info {
				flex: 1;
				min-width: 0;
			}
			.live-header-info h2 {
				margin-bottom: 4px;
				font-size: 22px;
				font-weight: 800;
				letter-spacing: -0.01em;
				text-transform: none;
				color: var(--text);
				word-break: break-word;
			}
			.mode-badge {
				font-size: 11px;
				font-weight: 700;
				letter-spacing: 0.03em;
				color: var(--text-faint);
			}
			.live-actions {
				display: flex;
				gap: 8px;
				flex-shrink: 0;
			}

			.live-section {
				padding: 13px 14px;
				border-bottom: 1px solid var(--border-soft);
				cursor: pointer;
				transition: background 0.12s ease;
			}
			.live-section:last-of-type {
				border-bottom: none;
			}
			.live-section:hover {
				background: var(--surface-alt);
			}
			.live-section.active {
				background: var(--live-soft);
				border-left: 3px solid var(--accent);
			}
			.live-section .label {
				font-weight: 700;
				font-size: 12px;
				letter-spacing: 0.03em;
				text-transform: uppercase;
				color: var(--accent);
				display: block;
				margin-bottom: 6px;
			}
			.live-section .lines {
				white-space: pre-line;
				color: var(--text);
				line-height: 1.6;
			}

			#clearBtn {
				margin-top: 18px;
				background: var(--bg);
			}
			#clearBtn:hover {
				background: var(--danger);
				border-color: var(--danger);
				color: #fff;
			}

			#toast {
				position: fixed;
				bottom: 28px;
				left: 50%;
				transform: translateX(-50%) translateY(20px);
				background: var(--text);
				color: var(--bg);
				padding: 10px 18px;
				font-size: 12px;
				font-weight: 700;
				letter-spacing: 0.02em;
				opacity: 0;
				pointer-events: none;
				transition:
					opacity 0.2s ease,
					transform 0.2s ease;
				z-index: 1000;
			}
			#toast.show {
				opacity: 1;
				transform: translateX(-50%) translateY(0);
			}
		</style>
	</head>
	<body>
		<div id="left">
			<div class="tag-row">
				<div class="tag-left">
					<span class="tag-new">LIVE</span>
					<span class="tag-label mono">SONG CONTROL</span>
				</div>
				<button
					class="theme-toggle"
					id="themeToggle"
					aria-label="Cycle theme (auto/light/dark)"
				>
					<svg
						class="icon-auto"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<circle cx="12" cy="12" r="9" />
						<path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none" />
					</svg>
					<svg
						class="icon-sun"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
					>
						<circle cx="12" cy="12" r="4" />
						<path
							d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
						/>
					</svg>
					<svg
						class="icon-moon"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
					</svg>
				</button>
			</div>
			<h2>Songs</h2>
			<button id="newSongBtn">+ New Song</button>
			<div id="songList"></div>
		</div>

		<div id="right">
			<div id="builder">
				<div class="builder-header">
					<h2 id="builderHeading">New Song</h2>
					<button type="button" id="cancelBuilderBtn">Cancel</button>
				</div>
				<input type="text" id="titleInput" placeholder="Song title" />
				<div class="mode-choice">
					<label>
						<input type="radio" name="mode" value="background" checked />
						<span>With Background</span>
					</label>
					<label>
						<input type="radio" name="mode" value="lower" />
						<span>Lower Transparent</span>
					</label>
				</div>
				<div id="sectionsWrap"></div>
				<button id="addSectionBtn">+ Add Section</button>
				<div class="builder-footer">
					<button id="saveSongBtn">Save Song</button>
					<button type="button" id="cancelBuilderBtn2">Cancel</button>
				</div>
			</div>

			<div id="liveView" style="display: none">
				<div class="live-header">
					<div class="live-header-info">
						<h2 id="liveTitleLabel"></h2>
						<span id="liveModeBadge" class="mode-badge"></span>
					</div>
					<div class="live-actions">
						<button id="editSongBtn">Edit Song</button>
						<button id="deleteSongBtn">Delete</button>
					</div>
				</div>
				<div id="liveSections"></div>
				<button id="clearBtn">Clear Output</button>
			</div>
		</div>

		<div id="toast"></div>

		<script>
			/* ── Theme (auto/light/dark, matches control.html) ─── */
			const themeToggle = document.getElementById("themeToggle");
			const media = window.matchMedia("(prefers-color-scheme: dark)");

			function applyTheme() {
				const mode = localStorage.getItem("themeMode") || "auto";
				const resolved =
					mode === "auto" ? (media.matches ? "dark" : "light") : mode;
				document.documentElement.setAttribute("data-theme", resolved);
				themeToggle.setAttribute("data-mode", mode);
			}
			applyTheme();

			media.addEventListener("change", () => {
				if ((localStorage.getItem("themeMode") || "auto") === "auto")
					applyTheme();
			});

			themeToggle.addEventListener("click", () => {
				const current = localStorage.getItem("themeMode") || "auto";
				const next =
					current === "auto" ? "light" : current === "light" ? "dark" : "auto";
				localStorage.setItem("themeMode", next);
				applyTheme();
			});

			/* ── App logic (unchanged behavior) ─────────────────── */
			const songListEl = document.getElementById("songList");
			const builder = document.getElementById("builder");
			const builderHeading = document.getElementById("builderHeading");
			const titleInput = document.getElementById("titleInput");
			const saveSongBtn = document.getElementById("saveSongBtn");
			const liveView = document.getElementById("liveView");
			const liveTitleLabel = document.getElementById("liveTitleLabel");
			const liveModeBadge = document.getElementById("liveModeBadge");
			const liveSections = document.getElementById("liveSections");
			const sectionsWrap = document.getElementById("sectionsWrap");
			const toast = document.getElementById("toast");

			let ws = null;
			let reconnectTimer = null;
			const messageQueue = [];

			let selectedSongId = null;
			let currentSongData = null;
			let editingSongId = null;
			let activeSectionIndex = -1;

			function showToast(message) {
				toast.textContent = message;
				toast.classList.add("show");
				setTimeout(() => toast.classList.remove("show"), 2000);
			}

			function getWsUrl() {
				const protocol = location.protocol === "https:" ? "wss:" : "ws:";
				return `${protocol}//${location.host}/ws`;
			}

			function connectWs() {
				if (
					ws &&
					(ws.readyState === WebSocket.OPEN ||
						ws.readyState === WebSocket.CONNECTING)
				) {
					return;
				}
				clearTimeout(reconnectTimer);

				try {
					ws = new WebSocket(getWsUrl());
				} catch (_) {
					scheduleReconnect();
					return;
				}

				ws.onopen = () => {
					clearTimeout(reconnectTimer);
					while (messageQueue.length > 0 && ws.readyState === WebSocket.OPEN) {
						const msg = messageQueue.shift();
						ws.send(msg);
					}
				};

				ws.onmessage = (e) => {
					try {
						const data = JSON.parse(e.data);
						if (data.channel !== "song") return;

						if (data.type === "clear") {
							activeSectionIndex = -1;
							document
								.querySelectorAll(".live-section")
								.forEach((el) => el.classList.remove("active"));
							return;
						}

						if (data.text) {
							const sections = [...liveSections.children];
							sections.forEach((el, i) => {
								const linesEl = el.querySelector(".lines");
								if (linesEl && linesEl.textContent === data.text) {
									activeSectionIndex = i;
									el.classList.add("active");
								} else {
									el.classList.remove("active");
								}
							});
						}
					} catch (_) {}
				};

				ws.onclose = () => {
					scheduleReconnect();
				};

				ws.onerror = () => {
					try {
						ws.close();
					} catch (_) {}
				};
			}

			function scheduleReconnect() {
				clearTimeout(reconnectTimer);
				reconnectTimer = setTimeout(() => {
					connectWs();
				}, 1000);
			}

			function sendWs(data) {
				const payload = typeof data === "string" ? data : JSON.stringify(data);
				if (ws && ws.readyState === WebSocket.OPEN) {
					ws.send(payload);
				} else {
					messageQueue.push(payload);
					connectWs();
				}
			}

			document.addEventListener("visibilitychange", () => {
				if (document.visibilityState === "visible") {
					if (
						!ws ||
						ws.readyState === WebSocket.CLOSED ||
						ws.readyState === WebSocket.CLOSING
					) {
						connectWs();
					}
					loadSongs();
				}
			});

			window.addEventListener("focus", () => {
				if (
					!ws ||
					ws.readyState === WebSocket.CLOSED ||
					ws.readyState === WebSocket.CLOSING
				) {
					connectWs();
				}
			});

			window.addEventListener("pageshow", () => {
				if (
					!ws ||
					ws.readyState === WebSocket.CLOSED ||
					ws.readyState === WebSocket.CLOSING
				) {
					connectWs();
				}
			});

			connectWs();

			async function loadSongs() {
				try {
					const res = await fetch("/api/songs");
					const songs = await res.json();
					songListEl.innerHTML = "";
					songs.forEach((song) => {
						const div = document.createElement("div");
						div.className = "song-item";
						if (song.id === selectedSongId) div.classList.add("selected");
						div.innerHTML = `${escapeHtml(song.title)}<span class="mode-tag">${song.display_mode === "background" ? "With Background" : "Lower Transparent"}</span>`;
						div.onclick = () => openSong(song.id);
						songListEl.appendChild(div);
					});
				} catch (_) {}
			}

			function escapeHtml(text) {
				const div = document.createElement("div");
				div.textContent = text ?? "";
				return div.innerHTML;
			}

			function addSectionBlock(label = "", lines = "") {
				const div = document.createElement("div");
				div.className = "section-block";
				div.innerHTML = `
					<div class="section-block-header">
						<input type="text" class="sec-label" placeholder="Section name (e.g. Verse 1, Chorus)" value="${escapeHtml(label)}" />
						<button type="button" class="remove-sec-btn" title="Remove section">✕</button>
					</div>
					<textarea class="sec-lines" placeholder="Type lyric lines for this section, one per line">${escapeHtml(lines)}</textarea>
				`;

				div.querySelector(".remove-sec-btn").onclick = () => {
					div.remove();
					if (sectionsWrap.children.length === 0) {
						addSectionBlock();
					}
				};

				sectionsWrap.appendChild(div);
			}

			document.getElementById("addSectionBtn").onclick = () =>
				addSectionBlock();

			document.getElementById("newSongBtn").onclick = () => {
				editingSongId = null;
				builderHeading.textContent = "New Song";
				saveSongBtn.textContent = "Save Song";
				titleInput.value = "";
				document.querySelector(
					'input[name="mode"][value="background"]',
				).checked = true;
				sectionsWrap.innerHTML = "";
				addSectionBlock();

				liveView.style.display = "none";
				builder.classList.add("active");
				titleInput.focus();
			};

			function cancelBuilder() {
				builder.classList.remove("active");
				if (selectedSongId && currentSongData) {
					liveView.style.display = "block";
				} else {
					liveView.style.display = "none";
				}
			}

			document.getElementById("cancelBuilderBtn").onclick = cancelBuilder;
			document.getElementById("cancelBuilderBtn2").onclick = cancelBuilder;

			document.getElementById("editSongBtn").onclick = () => {
				if (!currentSongData) return;
				editingSongId = currentSongData.id;
				builderHeading.textContent = `Edit Song: ${currentSongData.title}`;
				saveSongBtn.textContent = "Save Changes";
				titleInput.value = currentSongData.title;

				const modeRadio = document.querySelector(
					`input[name="mode"][value="${currentSongData.display_mode}"]`,
				);
				if (modeRadio) modeRadio.checked = true;

				sectionsWrap.innerHTML = "";
				if (currentSongData.sections && currentSongData.sections.length > 0) {
					currentSongData.sections.forEach((sec) => {
						const linesText = sec.lines.map((l) => l.text).join("\n");
						addSectionBlock(sec.label, linesText);
					});
				} else {
					addSectionBlock();
				}

				liveView.style.display = "none";
				builder.classList.add("active");
				titleInput.focus();
			};

			document.getElementById("deleteSongBtn").onclick = async () => {
				if (!selectedSongId || !currentSongData) return;
				const confirmed = confirm(
					`Are you sure you want to delete "${currentSongData.title}"?`,
				);
				if (!confirmed) return;

				try {
					const res = await fetch(`/api/songs/${selectedSongId}`, {
						method: "DELETE",
					});
					if (res.ok) {
						showToast("Song deleted");
						sendWs({ channel: "song", type: "clear" });
						selectedSongId = null;
						currentSongData = null;
						activeSectionIndex = -1;
						liveView.style.display = "none";
						builder.classList.remove("active");
						loadSongs();
					} else {
						alert("Failed to delete song");
					}
				} catch (_) {
					alert("Network error while deleting song");
				}
			};

			saveSongBtn.onclick = async () => {
				const title = titleInput.value.trim();
				if (!title) return alert("Enter a song title");
				const mode = document.querySelector("input[name=mode]:checked").value;

				const blocks = [...sectionsWrap.querySelectorAll(".section-block")];
				const sections = blocks
					.map((b) => {
						const label =
							b.querySelector(".sec-label").value.trim() || "Section";
						const lines = b
							.querySelector(".sec-lines")
							.value.split("\n")
							.map((l) => l.trim())
							.filter(Boolean);
						return { label, lines };
					})
					.filter((s) => s.lines.length > 0);

				if (!sections.length)
					return alert("Add at least one section with lyrics");

				try {
					if (editingSongId !== null) {
						const res = await fetch(`/api/songs/${editingSongId}`, {
							method: "PUT",
							headers: { "Content-Type": "application/json" },
							body: JSON.stringify({ title, display_mode: mode, sections }),
						});
						if (!res.ok) throw new Error("Failed to update song");
						showToast("Song updated successfully");
						builder.classList.remove("active");
						await loadSongs();
						await openSong(editingSongId);
					} else {
						const res = await fetch("/api/songs", {
							method: "POST",
							headers: { "Content-Type": "application/json" },
							body: JSON.stringify({ title, display_mode: mode, sections }),
						});
						if (!res.ok) throw new Error("Failed to create song");
						const data = await res.json();
						showToast("Song created successfully");
						builder.classList.remove("active");
						await loadSongs();
						if (data && data.id) {
							await openSong(data.id);
						}
					}
				} catch (err) {
					alert(err.message || "Failed to save song");
				}
			};

			async function openSong(id) {
				selectedSongId = id;
				activeSectionIndex = -1;
				builder.classList.remove("active");
				liveView.style.display = "block";

				try {
					const res = await fetch(`/api/songs/${id}`);
					const song = await res.json();
					currentSongData = song;

					liveTitleLabel.textContent = song.title;
					liveModeBadge.textContent =
						song.display_mode === "background"
							? "With Background"
							: "Lower Transparent";
					liveSections.innerHTML = "";

					if (song.sections) {
						song.sections.forEach((sec, i) => {
							const div = document.createElement("div");
							div.className = "live-section";
							const linesText = sec.lines.map((l) => l.text).join("\n");
							div.innerHTML = `<span class="label">${escapeHtml(sec.label)}</span><span class="lines">${escapeHtml(linesText)}</span>`;
							div.onclick = () => {
								activeSectionIndex = i;
								[...liveSections.children].forEach((el) =>
									el.classList.remove("active"),
								);
								div.classList.add("active");
								sendWs({
									channel: "song",
									mode: song.display_mode,
									text: linesText,
								});
							};
							liveSections.appendChild(div);
						});
					}

					loadSongs();
				} catch (_) {}
			}

			document.getElementById("clearBtn").onclick = () => {
				activeSectionIndex = -1;
				sendWs({ channel: "song", type: "clear" });
				document
					.querySelectorAll(".live-section")
					.forEach((el) => el.classList.remove("active"));
			};

			loadSongs();
		</script>
	</body>
</html>
